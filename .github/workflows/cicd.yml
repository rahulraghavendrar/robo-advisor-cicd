name: CI-CD Pipeline

# Runs automatically on every push to main (and can be started manually)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: robo-advisor

jobs:
  # ---------------- Stage 1: Build and test with Maven ----------------
  build-test:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile and package
        run: mvn -B clean package -DskipTests

      - name: Run unit tests
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/robo-advisor.jar

  # ---------------- Stage 2: Build Docker image and push to Docker Hub ----------------
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Set image tag (short commit SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${TAG} \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest .
          docker images

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest

  # ---------------- Stage 3: Deploy to Azure Kubernetes Service using Ansible ----------------
  deploy:
    name: Deploy to AKS (Ansible)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag (short commit SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure access to the AKS cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get nodes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Deploy / update application with Ansible
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e "image=${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${TAG}"

      # ---------------- Stage 4: Verify deployment ----------------
      - name: Verify deployment and application availability
        run: |
          kubectl get deployment robo-advisor
          kubectl get pods -l app=robo-advisor -o wide
          kubectl get service robo-advisor-service

          echo "Waiting for external IP of the LoadBalancer service..."
          for i in $(seq 1 30); do
            IP=$(kubectl get service robo-advisor-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then break; fi
            sleep 10
          done
          echo "Application URL: http://$IP"

          curl -f --retry 10 --retry-delay 6 --retry-all-errors http://$IP/api/health
          echo ""
          echo "### Deployment successful :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Application URL: http://$IP" >> $GITHUB_STEP_SUMMARY
          echo "Image tag: ${TAG}" >> $GITHUB_STEP_SUMMARY
