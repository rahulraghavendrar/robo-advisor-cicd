name: CI-CD Pipeline

# Runs automatically on every push to main (and can be started manually)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: robo-advisor

jobs:
  # ---------------- Stage 1: Build and test with Maven ----------------
  build-test:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile and package
        run: mvn -B clean package -DskipTests

      - name: Run unit tests
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/robo-advisor.jar

  # ---------------- Stage 2: Build Docker image and push to Docker Hub ----------------
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Set image tag (short commit SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${TAG} \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest .
          docker images

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest

  # ---------------- Stage 3: Deploy to Kubernetes (k3s) on AWS EC2 using Ansible ----------------
  deploy:
    name: Deploy to AWS EC2 k3s (Ansible)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag (short commit SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure access to the k3s cluster on EC2
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get nodes -o wide

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Deploy / update application with Ansible
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e "image=${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${TAG}"

      # ---------------- Stage 4: Verify deployment ----------------
      - name: Verify deployment and application availability
        run: |
          kubectl get deployment robo-advisor
          kubectl get pods -l app=robo-advisor -o wide
          kubectl get service robo-advisor-service
          kubectl describe deployment robo-advisor | grep Image

          # Public IP of the EC2 instance, taken from the kubeconfig server address
          HOST=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' | sed -E 's#^https://##; s#:[0-9]+$##')
          echo "Application URL: http://$HOST"

          OK=0
          for i in $(seq 1 30); do
            if HEALTH=$(curl -fs --max-time 5 http://$HOST/api/health); then OK=1; break; fi
            echo "Application not ready yet, retrying..."
            sleep 5
          done
          if [ "$OK" != "1" ]; then echo "Application not reachable"; exit 1; fi
          echo "$HEALTH"

          echo "### Deployment successful :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Application URL: http://$HOST" >> $GITHUB_STEP_SUMMARY
          echo "Image tag: ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "Health check: $HEALTH" >> $GITHUB_STEP_SUMMARY
