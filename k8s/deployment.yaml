apiVersion: apps/v1
kind: Deployment
metadata:
  name: robo-advisor
  labels:
    app: robo-advisor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: robo-advisor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: robo-advisor
      annotations:
        # Replaced by the Ansible playbook with the SHA-256 of configmap.yaml.
        # When the ConfigMap changes, this value changes, so Kubernetes rolls out new pods
        # that read the new environment variables.
        checksum/config: "not-set"
    spec:
      containers:
        - name: robo-advisor
          # The tag is replaced by the Ansible playbook with the commit SHA tag on every deploy
          image: rahul474/robo-advisor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Load every key of the ConfigMap as an environment variable
          envFrom:
            - configMapRef:
                name: robo-advisor-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
