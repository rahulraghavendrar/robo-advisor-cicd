<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboAdvisor Lite</title>
    <style>
        :root { --theme: #1f4e79; }
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
        .box { max-width: 520px; margin: 30px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
        h1 { margin-top: 0; color: var(--theme); font-size: 24px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 18px; width: 100%; padding: 10px; background: var(--theme); color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 18px; }
        td { border: 1px solid #ccc; padding: 8px; }
        .error { color: #b00020; margin-top: 12px; }
        .footer { text-align: center; color: #666; font-size: 13px; margin-top: 16px; }
        .badge { display: inline-block; background: var(--theme); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body>
<div class="box">
    <h1 id="title">RoboAdvisor Lite</h1>
    <p>Enter your details to get a suggested asset allocation and SIP projection.</p>

    <label for="age">Age</label>
    <input id="age" type="number" value="21" min="18" max="100">

    <label for="risk">Risk appetite</label>
    <select id="risk">
        <option value="LOW">Low</option>
        <option value="MEDIUM" selected>Medium</option>
        <option value="HIGH">High</option>
    </select>

    <label for="amount">Monthly investment (Rs.)</label>
    <input id="amount" type="number" value="5000" min="1">

    <label for="years">Investment period (years)</label>
    <input id="years" type="number" value="10" min="1" max="50">

    <button onclick="getAdvice()">Get Advice</button>

    <div id="error" class="error"></div>
    <div id="result"></div>
</div>
<div class="footer">Version: <span id="version">-</span> | Environment: <span id="env" class="badge">-</span> | <span id="message">-</span></div>

<script>
    // Settings come from the Kubernetes ConfigMap through /api/config
    fetch('/api/config').then(r => r.json()).then(c => {
        document.getElementById('title').innerText = c.title;
        document.title = c.title;
        document.getElementById('version').innerText = c.version;
        document.getElementById('env').innerText = c.environment;
        document.getElementById('message').innerText = c.message;
        document.documentElement.style.setProperty('--theme', c.themeColor);
    });

    function getAdvice() {
        const age = document.getElementById('age').value;
        const risk = document.getElementById('risk').value;
        const amount = document.getElementById('amount').value;
        const years = document.getElementById('years').value;
        document.getElementById('error').innerText = '';
        document.getElementById('result').innerHTML = '';

        fetch(`/api/advice?age=${age}&risk=${risk}&amount=${amount}&years=${years}`)
            .then(r => r.json().then(body => ({ ok: r.ok, body })))
            .then(({ ok, body }) => {
                if (!ok) {
                    document.getElementById('error').innerText = body.error;
                    return;
                }
                document.getElementById('result').innerHTML = `
                    <table>
                        <tr><td>Equity</td><td>${body.equityPercent}%</td></tr>
                        <tr><td>Debt</td><td>${body.debtPercent}%</td></tr>
                        <tr><td>Gold</td><td>${body.goldPercent}%</td></tr>
                        <tr><td>Expected return</td><td>${body.expectedAnnualReturn}% per year</td></tr>
                        <tr><td>Total invested</td><td>Rs. ${body.totalInvested.toLocaleString('en-IN')}</td></tr>
                        <tr><td>Projected value</td><td>Rs. ${body.projectedValue.toLocaleString('en-IN')}</td></tr>
                    </table>`;
            })
            .catch(() => document.getElementById('error').innerText = 'Could not reach server');
    }
</script>
</body>
</html>
