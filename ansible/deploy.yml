---
# Deploys (or updates) the RoboAdvisor application on Kubernetes (k3s on AWS EC2).
# Usage: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e "image=<user>/robo-advisor:<tag>"

- name: Deploy RoboAdvisor to Kubernetes
  hosts: deploy_host
  gather_facts: false

  vars:
    app_name: robo-advisor
    manifest_dir: "{{ playbook_dir }}/../k8s"
    image: "rahul474/robo-advisor:latest"
    rollout_timeout: 300s

  tasks:
    - name: Check that kubectl can reach the cluster
      ansible.builtin.command: kubectl cluster-info
      changed_when: false

    - name: Put the new image tag into the deployment manifest
      ansible.builtin.replace:
        path: "{{ manifest_dir }}/deployment.yaml"
        regexp: '^(\s*image:\s*).*$'
        replace: '\g<1>{{ image }}'

    - name: Calculate checksum of the ConfigMap file
      ansible.builtin.stat:
        path: "{{ manifest_dir }}/configmap.yaml"
        checksum_algorithm: sha256
      register: configmap_file

    - name: Put the ConfigMap checksum into the deployment (restarts pods when config changes)
      ansible.builtin.replace:
        path: "{{ manifest_dir }}/deployment.yaml"
        regexp: '^(\s*checksum/config:\s*).*$'
        replace: '\g<1>"{{ configmap_file.stat.checksum }}"'

    - name: Apply Kubernetes manifests (configmap + deployment + service)
      ansible.builtin.command: kubectl apply -f {{ manifest_dir }}
      register: apply_result
      changed_when: "'configured' in apply_result.stdout or 'created' in apply_result.stdout"

    - name: Show apply output
      ansible.builtin.debug:
        var: apply_result.stdout_lines

    - name: Wait for the rolling update to finish
      ansible.builtin.command: kubectl rollout status deployment/{{ app_name }} --timeout={{ rollout_timeout }}
      changed_when: false

    - name: Get the ConfigMap that is now in the cluster
      ansible.builtin.command: kubectl get configmap robo-advisor-config -o jsonpath={.data}
      register: configmap_data
      changed_when: false

    - name: Show ConfigMap values
      ansible.builtin.debug:
        var: configmap_data.stdout

    - name: Get running pods
      ansible.builtin.command: kubectl get pods -l app={{ app_name }} -o wide
      register: pods
      changed_when: false

    - name: Show running pods
      ansible.builtin.debug:
        var: pods.stdout_lines
